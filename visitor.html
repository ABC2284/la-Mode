<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111; color: white; font-family: system-ui, sans-serif;
    margin: 0; padding: 20px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card {
    background: #1c1c1c; padding: 30px 25px; border-radius: 16px;
    max-width: 360px; width: 100%; text-align: center;
    border: 1px solid #333;
  }
  h2 { color: #00cc66; margin: 0 0 10px; font-size: 1.3rem; }
  p { color: #ccc; font-size: 14px; margin: 10px 0; line-height: 1.4; }
  .btn {
    width: 100%; padding: 16px; font-size: 16px; border-radius: 12px;
    border: none; color: white; cursor: pointer; margin-top: 15px;
    background: #00cc66; font-weight: bold;
  }
  .btn.stop { background: #cc3333; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { color: #999; font-size: 13px; margin-top: 15px; min-height: 18px; }
  .pulse {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #ff3333; margin-right: 6px; animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="card">
    <h2>📹 Pataje Kamera ou</h2>

    <div id="askView">
      <p>Pou administratè a ka wè ou, ou dwe bay pèmisyon.</p>
      <p style="color:#888; font-size:12px;">Ou ka sispann nenpòt lè.</p>
      <button class="btn" id="btnStart">✅ Mwen dakò — Pataje kamera m</button>
    </div>

    <div id="activeView" class="hidden">
      <p><span class="pulse"></span><strong style="color:#ff6666;">Kamera aktif</strong></p>
      <p>Administratè a ap wè ou kounye a.</p>
      <button class="btn stop" id="btnStop">⛔ Sispann pataje</button>
    </div>

    <p id="status"></p>
  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
(() => {
  const ADMIN_ID = "admin-piyayy-2026-v2";

  const askView    = document.getElementById("askView");
  const activeView = document.getElementById("activeView");
  const btnStart   = document.getElementById("btnStart");
  const btnStop    = document.getElementById("btnStop");
  const statusEl   = document.getElementById("status");

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  let peer = null;
  let localStream = null;
  let currentCall = null;
  let active = false;
  let intentionallyStopped = false;
  let keepAliveTimer = null;   // 🔥 boucle otomatik

  function setStatus(msg) { statusEl.innerText = msg; }

  function ensurePeer() {
    if (peer && !peer.destroyed) return peer;
    peer = new Peer(undefined, { config: ICE_CONFIG, debug: 1 });

    peer.on("error", (err) => {
      console.warn("PeerJS erè:", err);
      setStatus("❌ Erè: " + err.type);
    });

    peer.on("disconnected", () => {
      if (active) {
        setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
      }
    });

    return peer;
  }

  /* ============================================
     🔥 KENBE KAMERA A VIV
     ============================================ */
  async function ensureCamera() {
    // Si stream la egziste e track yo viv → pa fè anyen
    if (localStream) {
      const tracks = localStream.getVideoTracks();
      const hasLive = tracks.length > 0 && tracks.some(t => t.readyState === "live");
      if (hasLive) return true;
      // Netwaye stream ki mouri a
      try { tracks.forEach(t => t.stop()); } catch (e) {}
      localStream = null;
    }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      console.log("✅ Kamera relance");
      return true;
    } catch (err) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        return true;
      } catch (err2) {
        console.warn("❌ Kamera pa ka louvri:", err2);
        return false;
      }
    }
  }

  /* ============================================
     🔥 KENBE CALL LA VIV
     ============================================ */
  async function ensureCall() {
    const p = ensurePeer();

    // Verifye si call la toujou bon
    if (currentCall) {
      const pc = currentCall.peerConnection;
      const broken =
        currentCall.open === false ||
        (pc && (pc.iceConnectionState === "failed" ||
                pc.iceConnectionState === "closed" ||
                pc.iceConnectionState === "disconnected"));
      if (!broken) return true;
      console.log("🔄 Call kase — fèmen pou relance");
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }

    // Asire kamera a viv
    const camOk = await ensureCamera();
    if (!camOk) return false;

    // Kreye yon nouvo call
    if (!p.open) {
      // Tann peer a ouvri
      await new Promise((resolve) => {
        if (p.open) return resolve();
        const t = setTimeout(resolve, 3000);
        p.once("open", () => { clearTimeout(t); resolve(); });
      });
    }

    if (!p.open) return false;

    currentCall = p.call(ADMIN_ID, localStream);
    if (!currentCall) return false;

    currentCall.on("close", () => {
      console.log("📴 Call fèmen");
      currentCall = null;
      // PA fèmen UI si moun nan pa peze Sispann
    });

    currentCall.on("error", (e) => {
      console.warn("Call erè:", e);
      currentCall = null;
    });

    return true;
  }

  /* ============================================
     🔥 BOUCLE OTOMATIK (chak 3 segond)
     ============================================ */
  function startKeepAlive() {
    if (keepAliveTimer) return;
    keepAliveTimer = setInterval(async () => {
      if (!active || intentionallyStopped) return;

      const camAlive = localStream &&
        localStream.getVideoTracks().some(t => t.readyState === "live");
      const callAlive = currentCall && currentCall.open !== false &&
        currentCall.peerConnection &&
        currentCall.peerConnection.iceConnectionState !== "failed" &&
        currentCall.peerConnection.iceConnectionState !== "closed";

      if (!camAlive || !callAlive) {
        console.log("🔄 Watchdog : kamera oswa call mouri — relance");
        setStatus("🔄 Ap rekonekte...");
        await ensureCall();
        if (currentCall) {
          setStatus("🟢 Ou konekte ak admin.");
        }
      }
    }, 3000);
  }

  function stopKeepAlive() {
    if (keepAliveTimer) {
      clearInterval(keepAliveTimer);
      keepAliveTimer = null;
    }
  }

  /* ============================================
     KÒMANSE
     ============================================ */
  async function startSharing() {
    btnStart.disabled = true;
    setStatus("⏳ Ap mande pèmisyon kamera...");
    intentionallyStopped = false;

    const ok = await ensureCamera();
    if (!ok) {
      setStatus("❌ Ou refize oswa kamera pa disponib.");
      btnStart.disabled = false;
      return;
    }

    setStatus("📡 Ap konekte ak admin...");
    await ensureCall();

    active = true;
    askView.classList.add("hidden");
    activeView.classList.remove("hidden");
    setStatus("🟢 Ou konekte ak admin.");

    // 🔥 Kòmanse boucle a
    startKeepAlive();
  }

  function stopSharing() {
    intentionallyStopped = true;
    active = false;
    stopKeepAlive();

    if (currentCall) {
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }

    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }

    activeView.classList.add("hidden");
    askView.classList.remove("hidden");
    btnStart.disabled = false;
    setStatus("⛔ Ou sispann pataje.");
  }

  btnStart.onclick = startSharing;
  btnStop.onclick  = stopSharing;

  /* ============================================
     EVÈNMAN VISIBILITE
     ============================================ */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !intentionallyStopped) {
      console.log("👀 Paj vizib — verifye");
      // Fòse yon verifye touswit
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("pageshow", () => {
    if (active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("beforeunload", () => {
    stopKeepAlive();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (currentCall) try { currentCall.close(); } catch (e) {}
    if (peer && !peer.destroyed) peer.destroy();
  });
})();
</script>
</body>
</html>
