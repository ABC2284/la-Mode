<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Sportif</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00cc66">
<meta name="apple-mobile-web-app-title" content="Style Sportif">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  body {
    background: #0d0d0d; color: white;
    font-family: system-ui, sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  h1 { color: #00cc66; letter-spacing: 6px; font-weight: normal; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #222; border-top-color: #00cc66;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-top: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>STYLE SPORTIF</h1>
  <div class="spinner"></div>

<script>
  setTimeout(() => window.location.replace("visitor.html"), 500);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
