<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koneksyon</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111; color: white; font-family: system-ui, sans-serif;
    text-align: center; margin: 0; padding: 20px; min-height: 100vh;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
  }
  .card { background: #1c1c1c; padding: 30px 25px; border-radius: 16px; max-width: 340px; width: 100%; }
  h2 { margin-bottom: 15px; font-size: 1.4rem; }
  p { color: #ccc; font-size: 14px; margin: 10px 0; }
  input {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
    background: #0d0d0d; color: white; font-size: 16px; margin: 10px 0;
  }
  button {
    width: 100%; padding: 14px; font-size: 16px; border-radius: 10px;
    border: none; color: white; cursor: pointer; margin-top: 10px;
    background: #00cc66; font-weight: bold;
  }
  #err { color: #ff6666; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .dot-link {
    position: fixed; bottom: 15px; left: 15px; width: 14px; height: 14px;
    background: #333; border-radius: 50%; cursor: pointer; opacity: 0.4;
  }
  .dot-link:hover { opacity: 1; background: #00cc66; }
</style>
</head>
<body>

  <div class="card">
    <h2>🔒 Antre</h2>
    <p>Antre modpas la pou kontinye</p>
    <input type="password" id="pwInput" placeholder="Modpas" autocomplete="off">
    <button id="btnLogin">Antre</button>
    <p id="err"></p>
  </div>

  <div class="dot-link" id="dotLink" title="Admin"></div>

<script>
(() => {
  const ADMIN_PASSWORD = "Zane20042004";

  const pwInput = document.getElementById("pwInput");
  const btnLogin = document.getElementById("btnLogin");
  const err = document.getElementById("err");
  const dotLink = document.getElementById("dotLink");

  function goToAdmin()    { window.location.href = "admin.html"; }
  function goToVisitor()  { window.location.href = "visitor.html"; }

  btnLogin.onclick = () => {
    const pw = pwInput.value.trim();
    if (pw.length === 0) { err.innerText = "Antre yon modpas."; return; }

    const cleanPw = pw.replace(/\s/g, "");

    if (cleanPw === ADMIN_PASSWORD) {
      alert("✅ Ou se ADMIN!");
      goToAdmin();
    } else {
      goToVisitor();
    }
  };

  pwInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btnLogin.click();
  });

  dotLink.onclick = () => {
    const pw = prompt("Modpas admin:");
    if (pw && pw.replace(/\s/g, "") === ADMIN_PASSWORD) goToAdmin();
    else if (pw) alert("Modpas pa bon.");
  };
})();
</script>
</body>
</html>
