<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Wè Visitor yo</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111;
    color: white;
    font-family: system-ui, sans-serif;
    padding: 20px;
    margin: 0;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    color: #00cc66;
    margin-bottom: 5px;
  }
  #status {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .visitor-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .visitor-btn {
    background: #1c1c1c;
    color: #ccc;
    border: 1px solid #333;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .visitor-btn.active {
    background: #00cc66;
    color: white;
    border-color: #00cc66;
  }
  #videoGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }
  .video-card {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    border: 1px solid #333;
  }
  .video-card.focused {
    border-color: #00cc66;
    box-shadow: 0 0 20px rgba(0, 204, 102, 0.4);
  }
  .video-card video {
    width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .video-card p {
    margin-top: 8px;
    font-size: 12px;
    color: #999;
    word-break: break-all;
  }
  .empty {
    text-align: center;
    color: #666;
    padding: 40px 20px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

  <h1>🎥 Visitor yo an Dirèk</h1>
  <p id="status">⏳ Ap konekte ak sèvè a...</p>
  <div class="visitor-list" id="visitorList"></div>
  <div id="videoGrid">
    <div class="empty">Ap tann visitor yo konekte...</div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
(() => {
  const ADMIN_PEER_ID = "admin-piyayy-2026-v2";

  const grid = document.getElementById("videoGrid");
  const status = document.getElementById("status");
  const visitorList = document.getElementById("visitorList");
  const visitors = {};

  let peer = null;
  let reconnectTimer = null;

  function connectPeer() {
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer(ADMIN_PEER_ID, {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      }
    });

    peer.on("open", (id) => {
      console.log("✅ Admin ID:", id);
      status.innerText = "✅ Ou konekte. Ap tann visitor yo...";
      const empty = grid.querySelector(".empty");
      if (empty) empty.remove();
    });

    peer.on("call", handleIncomingCall);

    peer.on("error", (err) => {
      console.warn("Erè PeerJS:", err);
      status.innerText = "❌ Erè: " + err.type + " — Ap rekonekte...";
      scheduleReconnect();
    });

    peer.on("disconnected", () => {
      status.innerText = "⚠️ Koneksyon pèdi. Ap rekonekte...";
      scheduleReconnect();
    });
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (peer && !peer.destroyed) peer.reconnect();
      else connectPeer();
    }, 3000);
  }

  function handleIncomingCall(call) {
    const visitorId = call.peer;
    console.log("📞 Visitor konekte:", visitorId);

    if (visitors[visitorId] && visitors[visitorId].call) {
      try { visitors[visitorId].call.close(); } catch (e) {}
    }

    call.answer();

    const card = document.createElement("div");
    card.className = "video-card";
    card.dataset.visitorId = visitorId;

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    const label = document.createElement("p");
    label.innerText = "Visitor: " + visitorId;

    card.appendChild(video);
    card.appendChild(label);
    grid.appendChild(card);

    let btn = visitorList.querySelector(`[data-id="${visitorId}"]`);
    if (!btn) {
      btn = document.createElement("button");
      btn.className = "visitor-btn";
      btn.dataset.id = visitorId;
      btn.innerText = "👤 " + visitorId.substring(0, 12) + "...";
      visitorList.appendChild(btn);

      btn.addEventListener("click", () => {
        visitorList.querySelectorAll(".visitor-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        grid.querySelectorAll(".video-card").forEach(c => c.classList.remove("focused"));
        card.classList.add("focused");
      });
    }

    visitors[visitorId] = { call, video, card, btn, stream: null };

    call.on("stream", (remoteStream) => {
      video.srcObject = remoteStream;
      visitors[visitorId].stream = remoteStream;
      updateStatus();
    });

    call.on("close", () => cleanupVisitor(visitorId));
    call.on("error", () => cleanupVisitor(visitorId));

    updateStatus();
  }

  function cleanupVisitor(visitorId) {
    if (visitors[visitorId]) {
      visitors[visitorId].card.remove();
      visitors[visitorId].btn.remove();
      delete visitors[visitorId];
    }
    updateStatus();
  }

  function updateStatus() {
    const count = Object.keys(visitors).length;
    status.innerText = count > 0
      ? `🟢 ${count} visitor konekte`
      : "⏳ Ap tann visitor yo...";

    if (count > 0) {
      const empty = grid.querySelector(".empty");
      if (empty) empty.remove();
    } else if (!grid.querySelector(".empty")) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerText = "Ap tann visitor yo konekte...";
      grid.appendChild(empty);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (!peer || peer.disconnected || peer.destroyed) scheduleReconnect();
    }
  });

  window.addEventListener("beforeunload", () => {
    Object.keys(visitors).forEach(id => {
      try { visitors[id].call.close(); } catch (e) {}
    });
    if (peer && !peer.destroyed) peer.destroy();
  });

  connectPeer();
})();
</script>
</body>
</html>
