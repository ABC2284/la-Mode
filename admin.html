<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Wè Visitor yo</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111; color: white; font-family: system-ui, sans-serif;
    padding: 20px; margin: 0; min-height: 100vh;
  }
  h1 { text-align: center; color: #00cc66; margin-bottom: 5px; }
  #status { text-align: center; color: #ccc; font-size: 14px; margin-bottom: 20px; }
  .visitor-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 20px;
  }
  .visitor-btn {
    background: #1c1c1c; color: #ccc; border: 1px solid #333;
    padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .visitor-btn.active {
    background: #00cc66; color: white; border-color: #00cc66;
  }
  #videoGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px; margin-top: 20px;
  }
  .video-card {
    background: #1c1c1c; border-radius: 12px; padding: 10px;
    text-align: center; border: 1px solid #333; position: relative;
  }
  .video-card.focused {
    border-color: #00cc66;
    box-shadow: 0 0 20px rgba(0, 204, 102, 0.4);
  }
  .video-card video {
    width: 100%; border-radius: 8px; background: #000; display: block;
    min-height: 180px;
  }
  .video-card p {
    margin-top: 8px; font-size: 12px; color: #999; word-break: break-all;
  }
  .live-dot {
    position: absolute; top: 18px; left: 18px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff3333; animation: pulse 1s infinite;
    z-index: 5;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .empty {
    text-align: center; color: #666; padding: 40px 20px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

  <h1>🎥 Visitor yo an Dirèk</h1>
  <p id="status">⏳ Ap konekte ak sèvè a...</p>
  <div class="visitor-list" id="visitorList"></div>
  <div id="videoGrid">
    <div class="empty">Ap tann visitor yo konekte...</div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
(() => {
  const ADMIN_PEER_ID = "admin-piyayy-2026-v2";

  const grid        = document.getElementById("videoGrid");
  const status      = document.getElementById("status");
  const visitorList = document.getElementById("visitorList");
  const visitors    = {};

  let peer = null;
  let reconnectTimer = null;

  /* ============================================
     STUN + TURN (esansyèl pou 4G/WiFi diferan)
     ============================================ */
  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  /* ============================================
     KONEKSYON PEER
     ============================================ */
  function connectPeer() {
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer(ADMIN_PEER_ID, { config: ICE_CONFIG, debug: 1 });

    peer.on("open", (id) => {
      console.log("✅ Admin ID:", id);
      status.innerText = "✅ Ou konekte. Ap tann visitor yo...";
      const empty = grid.querySelector(".empty");
      if (empty) empty.remove();
    });

    peer.on("call", handleIncomingCall);

    // Resevwa mesaj "bye" nan men visitor
    peer.on("connection", (conn) => {
      conn.on("data", (data) => {
        if (data && data.type === "bye") {
          console.log("👋 Visitor voye bye:", conn.peer);
          cleanupVisitor(conn.peer);
        }
      });
    });

    peer.on("error", (err) => {
      console.warn("Erè PeerJS:", err);
      if (err.type === "unavailable-id") {
        status.innerText = "❌ ID admin deja itilize. Ap eseye ankò nan 3s...";
        setTimeout(connectPeer, 3000);
        return;
      }
      status.innerText = "❌ Erè: " + err.type;
      scheduleReconnect();
    });

    peer.on("disconnected", () => {
      status.innerText = "⚠️ Koneksyon pèdi. Ap rekonekte...";
      scheduleReconnect();
    });
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (peer && !peer.destroyed) peer.reconnect();
      else connectPeer();
    }, 3000);
  }

  /* ============================================
     APÈL ANTRE (visitor → admin)
     ============================================ */
  function handleIncomingCall(call) {
    const visitorId = call.peer;
    console.log("📞 Visitor konekte:", visitorId);

    // Si menm visitor deja egziste, netwaye ansyen an
    if (visitors[visitorId]) {
      try { visitors[visitorId].call.close(); } catch (e) {}
      if (visitors[visitorId].card) visitors[visitorId].card.remove();
      if (visitors[visitorId].btn)  visitors[visitorId].btn.remove();
      delete visitors[visitorId];
    }

    // ✅ Reponn san voye okenn stream (visitor pa wè admin)
    call.answer();

    /* --- Kreye kat videyo a --- */
    const card = document.createElement("div");
    card.className = "video-card";
    card.dataset.visitorId = visitorId;

    const dot = document.createElement("div");
    dot.className = "live-dot";

    const video = document.createElement("video");
    video.autoplay    = true;
    video.playsInline = true;
    video.muted       = true;

    const label = document.createElement("p");
    label.innerText = "👤 " + visitorId;

    card.appendChild(dot);
    card.appendChild(video);
    card.appendChild(label);
    grid.appendChild(card);

    /* --- Bouton nan lis anwo a --- */
    let btn = visitorList.querySelector(`[data-id="${visitorId}"]`);
    if (!btn) {
      btn = document.createElement("button");
      btn.className = "visitor-btn";
      btn.dataset.id = visitorId;
      btn.innerText = "👤 " + visitorId.substring(0, 10) + "…";
      visitorList.appendChild(btn);

      btn.addEventListener("click", () => {
        visitorList.querySelectorAll(".visitor-btn")
          .forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        grid.querySelectorAll(".video-card")
          .forEach(c => c.classList.remove("focused"));
        card.classList.add("focused");
      });
    }

    // Objè visitor ak done pou watchdog
    visitors[visitorId] = {
      call, video, card, btn, stream: null,
      lastTime: 0,
      lastChange: Date.now(),
      watchdog: null,
      iceCheck: null
    };

    /* --- Stream rive --- */
    call.on("stream", (remoteStream) => {
      console.log("🎬 Stream rive pou:", visitorId);
      video.srcObject = remoteStream;
      video.play().catch(e => console.warn("play err:", e));
      visitors[visitorId].stream = remoteStream;
      visitors[visitorId].lastChange = Date.now();

      // ⏱ WATCHDOG 1 : track mute / ended
      const vTrack = remoteStream.getVideoTracks()[0];
      if (vTrack) {
        vTrack.onmute = () => {
          console.log("🔇 Track mute:", visitorId);
          // Tann 8 segond anvan retire (pèmèt relance visitor)
          setTimeout(() => {
            if (vTrack.muted && visitors[visitorId]) {
              console.log("💀 Track toujou mute — retire");
              cleanupVisitor(visitorId);
            }
          }, 8000);
        };
        vTrack.onended = () => {
          console.log("⏹ Track ended:", visitorId);
          // Tann 8 segond (visitor ka relance)
          setTimeout(() => {
            if (visitors[visitorId]) cleanupVisitor(visitorId);
          }, 8000);
        };
      }

      // ⏱ WATCHDOG 2 : imaj pa avanse pandan 10 segond
      visitors[visitorId].watchdog = setInterval(() => {
        const v = visitors[visitorId];
        if (!v || !v.video) return;

        const t = v.video.currentTime;
        if (t === v.lastTime) {
          const dead = Date.now() - v.lastChange;
          if (dead > 10000) {
            console.warn("💀 Imaj bloke depi 10s:", visitorId);
            cleanupVisitor(visitorId);
          }
        } else {
          v.lastTime = t;
          v.lastChange = Date.now();
        }
      }, 2000);

      // ⏱ WATCHDOG 3 : ICE state
      visitors[visitorId].iceCheck = setInterval(() => {
        const v = visitors[visitorId];
        if (!v) return;
        const pc = v.call && v.call.peerConnection;
        if (pc) {
          const s = pc.iceConnectionState;
          if (s === "failed" || s === "closed") {
            console.warn("💀 ICE", s, visitorId);
            cleanupVisitor(visitorId);
          }
        }
      }, 3000);

      updateStatus();
    });

    call.on("close", () => {
      console.log("📴 Call close:", visitorId);
      // Tann 3 segond — petèt visitor ap relance
      setTimeout(() => {
        if (visitors[visitorId]) cleanupVisitor(visitorId);
      }, 3000);
    });

    call.on("error", (e) => {
      console.warn("call err:", e);
      setTimeout(() => {
        if (visitors[visitorId]) cleanupVisitor(visitorId);
      }, 3000);
    });

    updateStatus();
  }

  /* ============================================
     NETWAYE YON VISITOR
     ============================================ */
  function cleanupVisitor(visitorId) {
    if (!visitors[visitorId]) return;
    const v = visitors[visitorId];

    if (v.watchdog) clearInterval(v.watchdog);
    if (v.iceCheck) clearInterval(v.iceCheck);
    if (v.stream) v.stream.getTracks().forEach(t => t.stop());
    try { v.call.close(); } catch (e) {}

    if (v.card) v.card.remove();
    if (v.btn)  v.btn.remove();

    delete visitors[visitorId];
    updateStatus();
  }

  /* ============================================
     MIZAJOU ESTATI
     ============================================ */
  function updateStatus() {
    const count = Object.keys(visitors).length;
    status.innerText = count > 0
      ? `🟢 ${count} visitor konekte`
      : "⏳ Ap tann visitor yo...";

    if (count > 0) {
      const empty = grid.querySelector(".empty");
      if (empty) empty.remove();
    } else if (!grid.querySelector(".empty")) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerText = "Ap tann visitor yo konekte...";
      grid.appendChild(empty);
    }
  }

  /* ============================================
     EVÈNMAN SISTÈM
     ============================================ */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (!peer || peer.disconnected || peer.destroyed) scheduleReconnect();
    }
  });

  window.addEventListener("beforeunload", () => {
    Object.keys(visitors).forEach(id => {
      try { visitors[id].call.close(); } catch (e) {}
    });
    if (peer && !peer.destroyed) peer.destroy();
  });

  connectPeer();
})();
</script>
</body>
</html>
