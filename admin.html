<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jesyon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: white;
    font-family: system-ui, sans-serif;
    padding: 15px; min-height: 100vh;
  }
  h1 { text-align: center; color: #00cc66; font-size: 1.3rem; margin-bottom: 5px; }
  #status { text-align: center; color: #ccc; font-size: 13px; margin-bottom: 15px; }

  /* ===== BOUTON AKTIVE SON ===== */
  .sound-btn {
    position: fixed; top: 15px; right: 15px;
    background: #00cc66; color: white;
    border: none; padding: 10px 15px;
    border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: bold;
    font-family: system-ui, sans-serif;
    z-index: 200;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .sound-btn.active { background: #009944; }
  .sound-btn.hidden { display: none; }

  .tabs { display: flex; gap: 5px; max-width: 600px; margin: 0 auto 15px; }
  .tab {
    flex: 1; padding: 12px; background: #1c1c1c;
    color: #ccc; border: 1px solid #333;
    border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: system-ui, sans-serif;
  }
  .tab.active { background: #00cc66; color: white; border-color: #00cc66; }

  .form-card {
    background: #1c1c1c; border-radius: 12px; padding: 15px;
    max-width: 600px; margin: 0 auto 15px;
    border: 1px solid #333;
  }
  .form-card h2 {
    color: #00cc66; font-size: 1rem; margin-bottom: 12px;
  }
  .form-group { margin-bottom: 10px; }
  .form-group label {
    display: block; font-size: 12px; color: #aaa;
    margin-bottom: 4px;
  }
  .form-group input {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #333; background: #0d0d0d;
    color: white; font-size: 14px;
    font-family: system-ui, sans-serif;
  }
  .form-group input:focus { outline: none; border-color: #00cc66; }

  .upload-zone {
    border: 2px dashed #444; border-radius: 10px;
    padding: 25px 15px; text-align: center;
    cursor: pointer; transition: all 0.2s;
    background: #0d0d0d;
  }
  .upload-zone:hover { border-color: #00cc66; background: #111; }
  .upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
  .upload-zone .text { font-size: 13px; color: #aaa; }
  .upload-zone.has-file {
    border-color: #00cc66; border-style: solid;
    background: #0d1a10;
  }

  .preview-box { text-align: center; margin-top: 10px; }
  .preview-box img {
    max-width: 150px; max-height: 150px;
    border-radius: 8px; border: 1px solid #333;
  }
  .preview-box .size {
    font-size: 11px; color: #888;
    margin-top: 5px;
  }

  .btn {
    width: 100%; padding: 14px; border-radius: 10px;
    border: none; color: white; cursor: pointer;
    font-size: 14px; font-weight: bold;
    font-family: system-ui, sans-serif;
    background: #00cc66;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #444; }

  .progress {
    width: 100%; height: 6px; background: #333;
    border-radius: 3px; overflow: hidden;
    margin-top: 10px; display: none;
  }
  .progress .bar {
    height: 100%; background: #00cc66; width: 0%;
    transition: width 0.3s;
  }

  .img-list {
    max-width: 600px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }
  .img-item {
    position: relative; aspect-ratio: 1/1;
    border-radius: 6px; overflow: hidden;
    background: #1c1c1c;
  }
  .img-item img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .img-item .actions {
    position: absolute; top: 3px; right: 3px;
    display: flex; gap: 3px; z-index: 5;
  }
  .img-item .actions button {
    width: 26px; height: 26px; border-radius: 50%;
    color: white; border: none;
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .img-item .edit { background: #2196f3; }
  .img-item .del { background: #cc3333; }
  .img-item .info {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 14px 4px 4px;
    font-size: 9px; text-align: center;
    text-transform: uppercase;
  }
  .img-item .info .price {
    color: #00cc66; font-weight: bold;
    display: block; margin-top: 2px;
  }

  .modal-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal {
    background: #1c1c1c; border-radius: 12px; padding: 20px;
    max-width: 400px; width: 100%;
    border: 1px solid #333;
  }
  .modal h3 {
    color: #00cc66; margin-bottom: 15px;
    font-size: 1.1rem;
  }
  .modal .modal-img { text-align: center; margin-bottom: 15px; }
  .modal .modal-img img {
    max-width: 120px; max-height: 120px;
    border-radius: 8px; border: 1px solid #333;
  }
  .modal .row { display: flex; gap: 8px; margin-top: 15px; }
  .modal .row .btn { margin: 0; }

  .visitor-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 15px;
  }
  .visitor-btn {
    background: #1c1c1c; color: #ccc; border: 1px solid #333;
    padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  .visitor-btn.active {
    background: #00cc66; color: white; border-color: #00cc66;
  }
  #videoGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px; max-width: 1200px; margin: 0 auto;
  }
  .video-card {
    background: #1c1c1c; border-radius: 12px; padding: 10px;
    text-align: center; border: 1px solid #333; position: relative;
  }
  .video-card.focused {
    border-color: #00cc66;
    box-shadow: 0 0 20px rgba(0, 204, 102, 0.4);
  }
  .video-card video {
    width: 100%; border-radius: 8px; background: #000;
    display: block; min-height: 180px;
  }
  .video-card p {
    margin-top: 8px; font-size: 12px; color: #999;
    word-break: break-all;
  }
  .live-dot {
    position: absolute; top: 18px; left: 18px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff3333; animation: pulse 1s infinite;
    z-index: 5;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .empty {
    text-align: center; color: #666; padding: 30px;
    font-size: 13px; grid-column: 1 / -1;
  }
  .hidden { display: none; }
</style>
</head>
<body>

  <!-- ===== BOUTON AKTIVE SON ===== -->
  <button class="sound-btn" id="btnSound">🔊 Aktive son</button>

  <h1>🎥 Admin — Jesyon</h1>
  <p id="status">⏳ Ap konekte...</p>

  <div class="tabs">
    <button class="tab active" id="tabVisitors">👁 Visitors</button>
    <button class="tab" id="tabImages">🖼 Imaj</button>
  </div>

  <div id="visitorsView">
    <div class="visitor-list" id="visitorList"></div>
    <div id="videoGrid">
      <div class="empty">Ap tann visitor yo konekte...</div>
    </div>
  </div>

  <div id="imagesView" class="hidden">
    <div class="form-card">
      <h2 id="formTitle">➕ Ajoute yon imaj</h2>

      <div class="form-group">
        <label>Chwazi foto a</label>
        <div class="upload-zone" id="uploadZone">
          <div class="icon">📷</div>
          <div class="text" id="uploadText">Klike pou chwazi yon foto</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
      </div>

      <div class="preview-box" id="preview"></div>

      <div class="form-group" style="margin-top:10px;">
