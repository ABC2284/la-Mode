<!DOCTYPE html>
<html>
<head>
  <title>Mwen - Kamera mwen</title>
  <style>
    body { background:#111; color:white; font-family:sans-serif; text-align:center; }
    video { width:90%; max-width:500px; border-radius:15px; background:black; margin-top:15px; }
    button { padding:15px 25px; font-size:18px; border-radius:10px; border:none; margin:10px; }
    #live { color:red; font-weight:bold; font-size:20px; display:none; }
  </style>
</head>
<body>
  <h2>Sistèm Kamera Pa Mwen</h2>
  <p>ID ou pou konekte: <b>zane2004</b></p>

  <button id="btnTel" style="background:#00cc66; color:white;">1. Mwen sou TELEFÒN - Pataje kamera mwen</button><br>
  <button id="btnPc" style="background:#0088ff; color:white;">2. Mwen sou PC - Gade telefòn mwen</button>

  <p id="live">🔴 AN DIRÈK - Telefòn sa a ap voye video bay PC a - Pwen vèt la limen</p>
  <video id="video" autoplay playsinline muted></video>
  <p id="info"></p>

<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script>
  const MON_ID = "zane2004"; // ID fiks ou
  let localStream;

  // --- SI OU SOU TELEFÒN ---
  document.getElementById('btnTel').onclick = async () => {
    const peer = new Peer(MON_ID);
    document.getElementById('info').innerText = "Ap tann PC... Kite paj sa a ouvè";
    
    localStream = await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById('video').srcObject = localStream;
    document.getElementById('live').style.display = "block";

    peer.on('call', call => {
      call.answer(localStream); // voye video telefòn nan bay PC a
      document.getElementById('info').innerText = "PC konekte! W ap difize kounya";
    });
  };

  // --- SI OU SOU PC ---
  document.getElementById('btnPc').onclick = () => {
    const peer = new Peer();
    document.getElementById('info').innerText = "Ap chèche telefòn nan...";
    
    peer.on('open', () => {
      const call = peer.call(MON_ID, new MediaStream()); // rele telefòn nan
      call.on('stream', remoteStream => {
        document.getElementById('video').srcObject = remoteStream;
        document.getElementById('info').innerText = "Ou wè kamera telefòn ou an dirèk!";
      });
      call.on('error', () => {
        document.getElementById('info').innerText = "Telefòn nan pa limen oswa li pa klike sou 'Pataje'";
      });
    });
  };
</script>
</body>
</html>
